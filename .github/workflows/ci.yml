# Tests on every push and pull request to main.
#
#   - engine + CLI tests (sidecar/test) on Linux, macOS and Windows, Node 20 and 22
#   - desktop shell tests (desktop/electron/test, no Electron needed)
#   - desktop client: build and layout check in headless Chromium
#   - packaging smoke test: build the CLI tarball and check it (Linux)
#   - desktop app: build the Linux AppImage (unsigned, not published) and
#     start the packaged app under Xvfb: its engine and Qdrant must answer
#
# Tests run offline: every model, API and website they need is faked on
# 127.0.0.1. Tests that need the real network are skipped unless
# OPENLEX_TEST_NETWORK=1, which CI never sets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - name: Install engine dependencies
        working-directory: sidecar
        run: npm ci --no-audit --no-fund
      # File list via bash: Node 20 takes a directory, Node 22 only files or globs.
      - name: Engine and CLI tests
        working-directory: sidecar
        shell: bash
        run: node --test test/*.test.js
      - name: Desktop shell tests
        shell: bash
        run: node --test desktop/electron/test/*.test.js

  package:
    name: package CLI tarball (smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - name: Build the tarball
        run: bash scripts/package-cli.sh
      - name: Check the tarball (unpack, no symlinks, all bin/*.js, ./openlex help)
        run: bash scripts/check-cli-tarball.sh
      - name: Rebuild and compare (reproducible build)
        run: |
          first=$(cut -d' ' -f1 dist/*.tar.gz.sha256)
          bash scripts/package-cli.sh
          second=$(cut -d' ' -f1 dist/*.tar.gz.sha256)
          echo "first $first"; echo "second $second"
          [ "$first" = "$second" ] || { echo "::error::the CLI tarball is not reproducible"; exit 1; }

  # The desktop app's screens: TypeScript build, then a layout check in
  # headless Chromium at 1366×768, 1024×768 and 800×900 (English and German):
  # no sideways scroll, the last sidebar entry reachable, the question field
  # at least 320 px wide (desktop/client/e2e/layout-check.mjs; fake model).
  client-layout:
    name: desktop client (build, layout check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/client/package-lock.json
            sidecar/package-lock.json
      - name: Install engine dependencies
        working-directory: sidecar
        run: npm ci --no-audit --no-fund
      - name: Install client dependencies
        working-directory: desktop/client
        run: npm ci --no-audit --no-fund
      - name: Build the client
        working-directory: desktop/client
        run: npm run build
      - name: Install Chromium for the check
        working-directory: sidecar
        run: npx playwright-core install --with-deps chromium
      - name: Layout check
        working-directory: desktop/client
        run: node e2e/layout-check.mjs

  desktop:
    name: package desktop app (Linux AppImage, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/electron/package-lock.json
            desktop/client/package-lock.json
            sidecar/package-lock.json
      # Electron itself and Qdrant / llama-server (sha256-checked when downloaded;
      # the key includes fetch-sidecars.js, so new pins mean a fresh download).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            desktop/electron/resources/bin
          key: desktop-linux-${{ hashFiles('desktop/electron/package-lock.json', 'desktop/electron/scripts/fetch-sidecars.js') }}
      - name: Install build tools
        run: npm ci --no-audit --no-fund
      - name: Stage UI, engine, Qdrant, llama-server
        run: node scripts/prepare-resources.js --linux --x64
      - name: Build the AppImage (unsigned, not published)
        run: npx electron-builder --linux --x64 --publish never
      - name: Smoke test (packaged files, bundled engine, the whole app under Xvfb)
        run: xvfb-run -a node scripts/smoke-packaged.js --launch
      - name: Size
        run: ls -la dist/*.AppImage && du -sh dist/linux-unpacked/resources/*

  # The install scripts against the latest published release, on real
  # Linux, macOS and Windows runners (Windows: PowerShell 5.1 and 7, the way
  # users run it: the script text piped into Invoke-Expression).
  installers:
    name: install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      # Asked with the workflow token, so the scripts need not call the
      # (rate-limited, unauthenticated) GitHub API on a shared runner.
      - name: Latest release
        id: latest
        shell: bash
        run: echo "version=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          OPENLEX_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          bash -n scripts/install.sh
          OPENLEX_HOME="$RUNNER_TEMP/ol" OPENLEX_BIN_DIR="$RUNNER_TEMP/olbin" bash scripts/install.sh | tee "$RUNNER_TEMP/install.log"
          grep -q "sha256 matches" "$RUNNER_TEMP/install.log"
          OPENLEX_DATA_DIR="$RUNNER_TEMP/data" "$RUNNER_TEMP/olbin/openlex" help > "$RUNNER_TEMP/help.txt"
          head -3 "$RUNNER_TEMP/help.txt"
      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          OPENLEX_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors; throw 'install.ps1 does not parse' }
          $env:OPENLEX_HOME = "$env:RUNNER_TEMP\ol51"
          Get-Content scripts\install.ps1 -Raw | Invoke-Expression
          $cmd = "$env:OPENLEX_HOME\bin\openlex.cmd"
          if (-not (Test-Path $cmd)) { throw 'openlex.cmd was not installed' }
          $env:OPENLEX_DATA_DIR = "$env:RUNNER_TEMP\data51"
          $out = & $cmd help; $code = $LASTEXITCODE
          $out | Select-Object -First 3
          if ($code -ne 0) { throw "openlex help exited with $code" }
      - name: install.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPENLEX_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          $env:OPENLEX_HOME = "$env:RUNNER_TEMP\ol7"
          Get-Content scripts\install.ps1 -Raw | Invoke-Expression
          $cmd = "$env:OPENLEX_HOME\bin\openlex.cmd"
          if (-not (Test-Path $cmd)) { throw 'openlex.cmd was not installed' }
          $env:OPENLEX_DATA_DIR = "$env:RUNNER_TEMP\data7"
          $out = & $cmd help; $code = $LASTEXITCODE
          $out | Select-Object -First 3
          if ($code -ne 0) { throw "openlex help exited with $code" }
