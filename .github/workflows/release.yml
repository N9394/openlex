# Release: build, sign and attest OpenLex in CI: the CLI tarball and the
# desktop installers.
#
# Trigger: push a tag vX.Y.Z whose version matches sidecar/package.json.
# (Run it by hand with "Run workflow" for a dry run: build + checks only,
# nothing is signed or published.)
#
# What ends up on the (draft) GitHub release, all built here, not on a laptop:
#   openlex-X.Y.Z.tar.gz                 the CLI + engine (reproducible build)
#   openlex-X.Y.Z.tar.gz.sha256          its checksum (used by the installers)
#   openlex-X.Y.Z.cdx.json               SBOM (CycloneDX, the shipped npm dependencies)
#   install.sh, install.ps1              the install scripts, so that
#                                        https://github.com/N9394/openlex/releases/latest/download/install.sh
#                                        (and install.ps1) always serve the latest ones
#   OpenLex-X.Y.Z-mac-arm64.dmg          desktop app, Apple Silicon
#   OpenLex-X.Y.Z-mac-x64.dmg            desktop app, Intel Mac
#   OpenLex-X.Y.Z-mac-arm64.zip, -mac-x64.zip   the same apps as zip: what
#                                        in-app updates on macOS install
#   OpenLex-X.Y.Z-windows-x64-setup.exe  desktop app, Windows (NSIS)
#   OpenLex-X.Y.Z-linux-x64.AppImage     desktop app, Linux
#   <installer>.sha256, <installer>.cdx.json   checksum and SBOM (syft) per installer
#   latest-mac.yml, latest.yml, latest-linux.yml   update metadata (version,
#                                        file names, SHA-512, sizes) in the shape
#                                        main/updater.js reads from an update feed
#   SHA256SUMS                           checksums of all of the above
#   <file>.bundle                        Sigstore (cosign, keyless) signature bundle for each file
# plus GitHub build provenance attestations for every file and an SBOM
# attestation for the tarball and for each installer (visible under the
# repository's "Attestations"). How anyone checks a download: docs/VERIFY.md.
#
# The desktop installers are UNSIGNED by default (macOS: ad hoc signature,
# not notarized; Windows: no Authenticode). docs/guides/desktop-app.md tells
# users how to open them. When the APPLE_* / AZURE_* repository secrets
# exist, the same jobs sign (and notarize) them instead, and the signed
# files replace the unsigned ones on the release (same names).
#
# The release is created as a DRAFT: read it, then press "Publish release".
# releases/latest/download/... URLs only work once a release is published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build CLI tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in release builds: everything comes from the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Version
        id: version
        run: |
          version=$(node -p "require('./sidecar/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match sidecar/package.json version $version"
            exit 1
          fi
      - name: Build the tarball (reproducible; mtimes = commit time)
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct); export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          bash scripts/package-cli.sh
      - name: Check the tarball
        run: bash scripts/check-cli-tarball.sh
      - name: Rebuild and compare (reproducible build)
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct); export SOURCE_DATE_EPOCH
          first=$(cut -d' ' -f1 dist/*.tar.gz.sha256)
          bash scripts/package-cli.sh
          second=$(cut -d' ' -f1 dist/*.tar.gz.sha256)
          [ "$first" = "$second" ] || { echo "::error::the tarball is not reproducible ($first vs $second)"; exit 1; }
          echo "reproducible: $first"
      - name: SBOM (CycloneDX, npm sbom)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd "dist/openlex-$VERSION/sidecar" && npm sbom --sbom-format cyclonedx --omit dev --omit optional --package-lock-only) > "dist/openlex-$VERSION.cdx.json"
          node -e "const s=require('./dist/openlex-$VERSION.cdx.json'); if(!s.components||!s.components.length) process.exit(1); console.log('SBOM: '+s.components.length+' components')"
      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          cp "dist/openlex-$VERSION.tar.gz" "dist/openlex-$VERSION.tar.gz.sha256" "dist/openlex-$VERSION.cdx.json" out/
          cp scripts/install.sh scripts/install.ps1 out/
          (cd out && sha256sum "openlex-$VERSION.tar.gz" "openlex-$VERSION.cdx.json" install.sh install.ps1 > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: out/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: sign and attest
    needs: [build, desktop, update-metadata]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write       # keyless signing (Sigstore) and attestations
      attestations: write   # store the attestations on GitHub
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: out
          merge-multiple: true
      - name: Checksums match the build; one SHA256SUMS for everything
        working-directory: out
        run: |
          sha256sum -c SHA256SUMS && sha256sum -c "openlex-$VERSION.tar.gz.sha256"
          for f in OpenLex-*.sha256; do sha256sum -c "$f"; done
          for f in OpenLex-* latest*.yml; do case "$f" in *.sha256) ;; *) sha256sum "$f" >> SHA256SUMS ;; esac; done
          sort -k2 -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS
          ls -la
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every file (cosign keyless, Sigstore bundle)
        working-directory: out
        run: |
          for f in *; do
            case "$f" in *.bundle) continue;; esac
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
      - name: Check the signatures the way users will
        working-directory: out
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          echo "signer identity: $IDENTITY"
          for b in *.bundle; do
            cosign verify-blob --bundle "$b" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "${b%.bundle}"
          done
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/openlex-${{ env.VERSION }}.tar.gz
            out/openlex-${{ env.VERSION }}.cdx.json
            out/install.sh
            out/install.ps1
            out/SHA256SUMS
            out/OpenLex-${{ env.VERSION }}-mac-arm64.dmg
            out/OpenLex-${{ env.VERSION }}-mac-x64.dmg
            out/OpenLex-${{ env.VERSION }}-mac-arm64.zip
            out/OpenLex-${{ env.VERSION }}-mac-x64.zip
            out/latest-mac.yml
            out/latest.yml
            out/latest-linux.yml
            out/OpenLex-${{ env.VERSION }}-windows-x64-setup.exe
            out/OpenLex-${{ env.VERSION }}-linux-x64.AppImage
            out/OpenLex-${{ env.VERSION }}-*.cdx.json
      - name: SBOM attestation for the tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/openlex-${{ env.VERSION }}.tar.gz
          sbom-path: out/openlex-${{ env.VERSION }}.cdx.json
      - name: SBOM attestation, macOS (Apple Silicon)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/OpenLex-${{ env.VERSION }}-mac-arm64.dmg
          sbom-path: out/OpenLex-${{ env.VERSION }}-mac-arm64.dmg.cdx.json
      - name: SBOM attestation, macOS (Intel)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/OpenLex-${{ env.VERSION }}-mac-x64.dmg
          sbom-path: out/OpenLex-${{ env.VERSION }}-mac-x64.dmg.cdx.json
      - name: SBOM attestation, macOS update zip (Apple Silicon)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/OpenLex-${{ env.VERSION }}-mac-arm64.zip
          sbom-path: out/OpenLex-${{ env.VERSION }}-mac-arm64.zip.cdx.json
      - name: SBOM attestation, macOS update zip (Intel)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/OpenLex-${{ env.VERSION }}-mac-x64.zip
          sbom-path: out/OpenLex-${{ env.VERSION }}-mac-x64.zip.cdx.json
      - name: SBOM attestation, Windows
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/OpenLex-${{ env.VERSION }}-windows-x64-setup.exe
          sbom-path: out/OpenLex-${{ env.VERSION }}-windows-x64-setup.exe.cdx.json
      - name: SBOM attestation, Linux
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/OpenLex-${{ env.VERSION }}-linux-x64.AppImage
          sbom-path: out/OpenLex-${{ env.VERSION }}-linux-x64.AppImage.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-signed
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: draft GitHub release
    needs: [build, sign]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the release and upload its files
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files-signed
          path: out
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "OpenLex $VERSION" > notes.md
          cat >> notes.md <<EOF

          ---
          **Desktop app:** \`OpenLex-$VERSION-mac-arm64.dmg\` (Apple Silicon), \`OpenLex-$VERSION-mac-x64.dmg\` (Intel Mac), \`OpenLex-$VERSION-windows-x64-setup.exe\`, \`OpenLex-$VERSION-linux-x64.AppImage\`. The \`.zip\` files and \`latest*.yml\` are for in-app updates. These builds are not signed by Apple or Microsoft: how to open them the first time is in [docs/guides/desktop-app.md](https://github.com/$GH_REPO/blob/$TAG/docs/guides/desktop-app.md).

          **Verify this download:** every file is signed (Sigstore, \`*.bundle\`) and has a build provenance attestation from this repository's release workflow. See [docs/VERIFY.md](https://github.com/$GH_REPO/blob/$TAG/docs/VERIFY.md).
          EOF
      - name: Create or update the draft release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --draft --verify-tag --title "OpenLex $VERSION" --notes-file notes.md
          fi
          gh release view "$TAG" --json url,isDraft,assets -q '"\(.url) draft=\(.isDraft)\n" + ([.assets[].name] | join("\n"))'

  # ── Desktop installers ─────────────────────────────────────────────────
  #
  # Unsigned by default. Signing turns on per platform when ALL of its
  # repository secrets exist (Settings → Secrets and variables → Actions),
  # and only for tag builds:
  #   macOS (Developer ID + notarization):
  #     APPLE_CERTIFICATE_P12_BASE64   Developer ID Application certificate (.p12, base64)
  #     APPLE_CERTIFICATE_PASSWORD     its password
  #     APPLE_SIGNING_IDENTITY         e.g. "Developer ID Application: Name (TEAMID)"
  #     APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   for notarytool
  #   Windows (Azure Trusted Signing / Artifact Signing):
  #     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
  #     AZURE_SIGNING_ENDPOINT         e.g. https://weu.codesigning.azure.net/
  #     AZURE_SIGNING_ACCOUNT          the signing account name
  #     AZURE_CERT_PROFILE             the certificate profile name
  # The signed installers then replace the unsigned ones (same file names).
  # NOTE: the signing steps are untested until certificates exist.
  installer-gate:
    name: installer signing configured?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      apple: ${{ steps.check.outputs.apple }}
      azure: ${{ steps.check.outputs.azure }}
    steps:
      - id: check
        env:
          A1: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          A2: ${{ secrets.APPLE_ID }}
          A3: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          A4: ${{ secrets.APPLE_TEAM_ID }}
          Z1: ${{ secrets.AZURE_CLIENT_ID }}
          Z2: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          Z3: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          Z4: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          apple=false; azure=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ -n "$A1" ] && [ -n "$A2" ] && [ -n "$A3" ] && [ -n "$A4" ] && apple=true
            [ -n "$Z1" ] && [ -n "$Z2" ] && [ -n "$Z3" ] && [ -n "$Z4" ] && azure=true
          fi
          echo "apple=$apple" >> "$GITHUB_OUTPUT"; echo "azure=$azure" >> "$GITHUB_OUTPUT"
          echo "macOS signing + notarization: $apple · Windows Authenticode: $azure"

  desktop:
    name: desktop installer (${{ matrix.name }})
    needs: [build, installer-gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, os: macos-latest, target: mac, arch: arm64, file: mac-arm64.dmg, zip: mac-arm64.zip }
          - { name: macOS Intel, os: macos-latest, target: mac, arch: x64, file: mac-x64.dmg, zip: mac-x64.zip }
          - { name: Windows, os: windows-latest, target: win, arch: x64, file: windows-x64-setup.exe }
          - { name: Linux, os: ubuntu-latest, target: linux, arch: x64, file: linux-x64.AppImage }
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SIGN_MAC: ${{ matrix.target == 'mac' && needs.installer-gate.outputs.apple == 'true' }}
      SIGN_WIN: ${{ matrix.target == 'win' && needs.installer-gate.outputs.azure == 'true' }}
    defaults:
      run:
        shell: bash
        working-directory: desktop/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in release builds: everything comes from the lockfiles.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install build tools
        run: npm ci --no-audit --no-fund
      - name: Stage UI, engine, Qdrant, llama-server
        run: node scripts/prepare-resources.js --${{ matrix.target }} --${{ matrix.arch }}
      - name: Build the installer (unsigned)
        if: env.SIGN_MAC != 'true'
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never -c.extraMetadata.version="$VERSION"
      - name: Build, sign and notarize (macOS, Developer ID)
        if: env.SIGN_MAC == 'true'
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          npx electron-builder --mac --${{ matrix.arch }} --publish never -c.extraMetadata.version="$VERSION" \
            "-c.mac.identity=$SIGNING_IDENTITY" -c.mac.hardenedRuntime=true -c.mac.notarize=true
      - name: Check signature and notarization (macOS)
        if: env.SIGN_MAC == 'true'
        run: |
          app=$(find dist -maxdepth 2 -name 'OpenLex.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
      - name: Sign the installer (Windows, Azure Trusted Signing)
        if: env.SIGN_WIN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\desktop\electron\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Check the signature (Windows)
        if: env.SIGN_WIN == 'true'
        shell: pwsh
        working-directory: desktop/electron/dist
        run: |
          Get-ChildItem -Filter *.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "$($_.Name) is not validly signed" }
          }
      - name: Smoke test (Linux, the whole app under Xvfb)
        if: matrix.target == 'linux'
        run: xvfb-run -a node scripts/smoke-packaged.js --launch
      - name: Smoke test (bundled engine + Qdrant from the packaged app)
        if: matrix.target != 'linux'
        run: node scripts/smoke-packaged.js --arch=${{ matrix.arch }}
      - name: Check the update zip (macOS)
        if: matrix.target == 'mac'
        run: |
          z="dist/OpenLex-$VERSION-${{ matrix.zip }}"
          [ -f "$z" ] || { echo "::error::$z not built"; ls dist; exit 1; }
          t=$(mktemp -d)
          ditto -x -k "$z" "$t"
          app="$t/OpenLex.app"
          [ -d "$app" ] || { echo "::error::$z has no OpenLex.app at its top"; ls -la "$t"; exit 1; }
          v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          [ "$v" = "$VERSION" ] || { echo "::error::zip app version $v, expected $VERSION"; exit 1; }
          [ "$id" = "com.lexvault.app" ] || { echo "::error::zip app id $id"; exit 1; }
          # Framework symlinks must survive the zip, or the signature breaks.
          [ -L "$app/Contents/Frameworks/Electron Framework.framework/Versions/Current" ] || { echo "::error::framework symlinks lost in the zip"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "update zip ok: $z ($v, $id)"
          rm -rf "$t"
      - name: Collect the installer
        run: |
          f="OpenLex-$VERSION-${{ matrix.file }}"
          mkdir -p ../../desktop-out
          [ -f "dist/$f" ] || { echo "::error::dist/$f not built"; ls dist; exit 1; }
          cp "dist/$f" ../../desktop-out/
          if [ -n "${{ matrix.zip }}" ]; then cp "dist/OpenLex-$VERSION-${{ matrix.zip }}" ../../desktop-out/; echo "ZIP=OpenLex-$VERSION-${{ matrix.zip }}" >> "$GITHUB_ENV"; fi
          case "${{ matrix.target }}-${{ matrix.arch }}" in
            mac-arm64) echo "UNPACKED=desktop/electron/dist/mac-arm64" >> "$GITHUB_ENV" ;;
            mac-x64)   echo "UNPACKED=desktop/electron/dist/mac" >> "$GITHUB_ENV" ;;
            win-*)     echo "UNPACKED=desktop/electron/dist/win-unpacked" >> "$GITHUB_ENV" ;;
            linux-*)   echo "UNPACKED=desktop/electron/dist/linux-unpacked" >> "$GITHUB_ENV" ;;
          esac
          echo "FILE=$f" >> "$GITHUB_ENV"
          ls -la ../../desktop-out
      - name: SBOM (CycloneDX, syft, everything inside the app)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ env.UNPACKED }}
          format: cyclonedx-json
          output-file: desktop-out/${{ env.FILE }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksum
        working-directory: desktop-out
        run: |
          node -e "const s=require('./$FILE.cdx.json'); if(!s.components||!s.components.length) process.exit(1); console.log('SBOM: '+s.components.length+' components')"
          if command -v sha256sum >/dev/null; then sha256sum "$FILE" > "$FILE.sha256"; else shasum -a 256 "$FILE" > "$FILE.sha256"; fi
          cat "$FILE.sha256"
          if [ -n "${ZIP:-}" ]; then
            # The zip holds the same app as the dmg: same SBOM.
            cp "$FILE.cdx.json" "$ZIP.cdx.json"
            shasum -a 256 "$ZIP" > "$ZIP.sha256"
            cat "$ZIP.sha256"
          fi
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: desktop-out/
          if-no-files-found: error
          retention-days: 7

  # latest-mac.yml / latest.yml / latest-linux.yml for update feeds (the
  # shape main/updater.js reads). Runs on dry runs too, so a "Run workflow"
  # checks it. Named desktop-* so the sign job picks it up with the installers.
  update-metadata:
    name: update metadata
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: desktop/electron/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - name: Write latest*.yml
        run: |
          node desktop/electron/scripts/update-info.js installers "$VERSION"
          mkdir -p meta && mv installers/latest*.yml meta/
          for f in meta/*.yml; do echo "── $f"; cat "$f"; done
          # every macOS update zip is listed, with the SHA-512 of the file built here
          for a in arm64 x64; do
            z="OpenLex-$VERSION-mac-$a.zip"
            grep -q "url: $z" meta/latest-mac.yml || { echo "::error::$z missing from latest-mac.yml"; exit 1; }
            want=$(openssl dgst -sha512 -binary "installers/$z" | base64 -w0)
            grep -q "sha512: $want" meta/latest-mac.yml || { echo "::error::$z SHA-512 mismatch"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-update-metadata
          path: meta/
          if-no-files-found: error
          retention-days: 7
