# GOWA licence register — every source of training data, labels or weights.
#
# Rule: GOWA is published under Apache-2.0, so nothing non-commercial (NC),
# nothing with an unknown or unclear licence, and never client data goes in.
# A source is used only when it is listed here with `include: yes`; the
# converters, the label script and the trainer refuse anything else
# (gowa/register.py, check_datasets.py; the engine's test suite validates
# this file too).
#
# Fields (all required):
#   id          short id, used in every example's "source" field
#   name        what it is
#   kind        dataset | corpus | model | labeler | never
#   source      where it comes from (URL or description)
#   licence     licence as published (SPDX id where there is one)
#   commercial  yes | no | unclear — may a commercially usable model be trained on it?
#   include     yes | no — used for GOWA now
#   tasks       which GOWA tasks it feeds ([] for none)
#   reason      why it is in or out, in one line
# Optional:
#   subsets     for collections whose parts have their own licences: only the
#               subsets listed here are cleared (empty = none yet)
#
# Format: a strict subset of YAML (one "- id:" block per source, "key: value"
# lines, [a, b] lists, # comments) so that it can be checked without a YAML
# library. Licence facts as checked on 2026-10-30 (Hugging Face dataset tags
# and model cards); re-check before each public release.

datasets:
  - id: mmbert-small
    name: mmBERT-small (base encoder for GOWA small)
    kind: model
    source: https://huggingface.co/jhu-clsp/mmBERT-small
    licence: MIT
    commercial: yes
    include: yes
    tasks: [redaction, injection, claim_support, clause_type, relevance, routing, in_force, general]
    reason: MIT weights; pretraining data MIT (decay data) and ODC-By (FineWeb2).

  - id: cuad
    name: CUAD — 510 English commercial contracts, 41 clause types
    kind: dataset
    source: https://huggingface.co/datasets/theatticusproject/cuad
    licence: CC-BY-4.0
    commercial: yes
    include: yes
    tasks: [clause_type]
    reason: Commercial use allowed with attribution (credited in the model card).

  - id: lexglue
    name: LexGLUE (LEDGAR, UNFAIR-ToS, and other tasks)
    kind: dataset
    source: https://huggingface.co/datasets/coastalcph/lex_glue
    licence: CC-BY-4.0
    commercial: yes
    include: yes
    tasks: [clause_type, relevance]
    reason: Commercial use allowed with attribution; LEDGAR provisions and UNFAIR-ToS clause categories.

  - id: multi_eurlex
    name: MultiEURLEX — EU laws in 23 languages with EuroVoc topics
    kind: dataset
    source: https://huggingface.co/datasets/coastalcph/multi_eurlex
    licence: CC-BY-4.0
    commercial: yes
    include: yes
    tasks: [clause_type, relevance, general]
    reason: Multilingual legal topic labels incl. DE, EN, CS, SK, PL, RO, HU, FR; attribution.

  - id: lextreme
    name: LEXTREME — multilingual legal benchmark (collection)
    kind: dataset
    source: https://huggingface.co/datasets/joelniklaus/lextreme
    licence: CC-BY-4.0 (collection); each task keeps its own licence
    commercial: unclear
    include: yes
    subsets: []
    tasks: [clause_type, relevance, general]
    reason: OK per task only — a subset is used after its own licence was checked and it is listed under subsets.

  - id: tasksource_synthetic_typed
    name: tasksource synthetic typed decisions
    kind: dataset
    source: https://huggingface.co/datasets/tasksource/synthetic-typed-decisions
    licence: Apache-2.0
    commercial: yes
    include: yes
    tasks: [general]
    reason: Typed noul/choice/score decisions under Apache-2.0; teaches the question format.

  - id: eurlex_texts
    name: EUR-Lex legislation texts (official, 24 languages)
    kind: corpus
    source: https://eur-lex.europa.eu (reuse under Commission Decision 2011/833/EU)
    licence: EU reuse policy (attribution)
    commercial: yes
    include: yes
    tasks: [claim_support, relevance, in_force, redaction, injection]
    reason: Official EU texts may be reused commercially with attribution; input for LLM-made labels.

  - id: ris_at
    name: Austrian federal law (RIS open data)
    kind: corpus
    source: https://data.bka.gv.at (RIS OGD)
    licence: CC-BY-4.0
    commercial: yes
    include: yes
    tasks: [claim_support, relevance, in_force, redaction, injection]
    reason: Open government data with attribution.

  - id: legifrance
    name: French legislation (Légifrance open data)
    kind: corpus
    source: https://www.legifrance.gouv.fr (DILA open data)
    licence: Licence Ouverte / Etalab-2.0
    commercial: yes
    include: yes
    tasks: [claim_support, relevance, in_force, redaction, injection]
    reason: Open licence allowing commercial reuse with attribution.

  - id: official_laws_de_cz_sk_pl_ro_hu
    name: Official statute texts from the national gazettes (DE, CZ, SK, PL, RO, HU)
    kind: corpus
    source: gesetze-im-internet.de, e-sbirka.cz, slov-lex.sk, isap.sejm.gov.pl, legislatie.just.ro, njt.hu
    licence: Official works, excluded from copyright (DE §5 UrhG; CZ §3 Act 121/2000; SK §5 Act 185/2015; PL art. 4 copyright act; RO art. 9 Law 8/1996; HU Szjt. 1. § (4))
    commercial: yes
    include: yes
    tasks: [claim_support, relevance, in_force, redaction, injection]
    reason: Official texts only, taken from the official portals — never from a commercial consolidation or commentary.

  - id: openlex_llm_labels
    name: Labels made by an open LLM on the included public texts (label_llm.py)
    kind: dataset
    source: models/gowa/label_llm.py run on a GPU over the corpora above
    licence: Apache-2.0 (ours)
    commercial: yes
    include: yes
    tasks: [redaction, injection, claim_support, clause_type, relevance, routing, in_force]
    reason: Our own labels on cleared public text, made with an Apache-2.0 model; inherits the input texts' attribution duties.

  - id: qwen3
    name: Qwen3 open-weight models (labeler for label_llm.py)
    kind: labeler
    source: https://huggingface.co/Qwen
    licence: Apache-2.0
    commercial: yes
    include: yes
    tasks: []
    reason: Apache-2.0 sizes only (check the card of the exact checkpoint); its outputs on public text become our labels.

  - id: openlex_seed
    name: Hand-written seed examples in this repository (models/gowa/seed/)
    kind: dataset
    source: models/gowa/seed/*.jsonl
    licence: Apache-2.0
    commercial: yes
    include: yes
    tasks: [routing, injection, redaction]
    reason: Written for OpenLex, invented names only; small, for routing and hard negatives.

  - id: legalbench
    name: LegalBench
    kind: dataset
    source: https://huggingface.co/datasets/nguha/legalbench
    licence: CC-BY-4.0 overall; per-task licences vary (some NC)
    commercial: unclear
    include: no
    tasks: []
    reason: Varies per task and some tasks are non-commercial; clear task by task before any use.

  - id: contract_nli
    name: ContractNLI
    kind: dataset
    source: https://huggingface.co/datasets/kiddothe2b/contract-nli
    licence: CC-BY-NC-SA-4.0 (Hugging Face mirror); official licence unclear
    commercial: no
    include: no
    tasks: []
    reason: Excluded until the licence is cleared with the authors — NC on the mirror.

  - id: ai4privacy
    name: ai4privacy PII datasets
    kind: dataset
    source: https://huggingface.co/ai4privacy
    licence: other (custom)
    commercial: unclear
    include: no
    tasks: []
    reason: Custom licence with restrictions; excluded until cleared.

  # ── Kev decision-v7, audited source by source (2026-11-02) ────────────────
  # Kev's released models (github.com/jaredpalmer/kev, commit 2074cc44,
  # evals/v7/decision-v7/manifest.json) share one training set: 10,000
  # records from ten public datasets (public-pool-v4) + 896 generated policy
  # records + 1,680 records from 60 generated rule structures. Kev's Apache
  # weights do not clean its data, so the mixed dump stays out and each part
  # is judged on the licence its own authors publish. convert.py kev_clean
  # builds examples only from the parts below with include: yes, fetched
  # from their own upstream (not from a Kev dump).
  - id: kev_decision_v7
    name: Kev decision-v7 training mix as a whole (the mixed dump)
    kind: dataset
    source: https://github.com/jaredpalmer/kev (evals/v7/decision-v7; train.jsonl on the Hub mirror jaredpalmer/kev-suites)
    licence: mixed — see the per-source entries below (AG News, Yelp, IMDb, Amazon NC or restrictive; TREC, SST-5 unknown)
    commercial: no
    include: no
    tasks: []
    reason: The mix contains non-commercial and unknown parts; only the cleared sources below are taken in, each from its own upstream.

  - id: banking77
    name: BANKING77 (PolyAI) — 13,083 online-banking queries, 77 intents (Kev decision-v7, choice)
    kind: dataset
    source: https://github.com/PolyAI-LDN/task-specific-datasets (banking_data/, commit 57ec275d)
    licence: CC-BY-4.0
    commercial: yes
    include: yes
    tasks: [general]
    reason: CC-BY-4.0 per PolyAI's own repository; attribution in the model card. Feeds choice questions (intent, up to 20 options with a none-of-the-above variant).

  - id: multinli
    name: MultiNLI (NYU) — 433k sentence pairs; only the non-fiction genres (Kev decision-v7, choice)
    kind: dataset
    source: https://huggingface.co/datasets/nyu-mll/multi_nli (the authors' own release, revision da70db2a; cims.nyu.edu/~sbowman/multinli)
    licence: OANC licence (free use, modification and sharing) for the government, slate, telephone and travel genres; the fiction genre is dropped (one CC-BY-SA-3.0 work)
    commercial: yes
    include: yes
    tasks: [general]
    reason: Per the authors' data statement the non-fiction genres are under the permissive OANC licence; fiction is excluded by the converter (genre filter) because one work in it is share-alike. Feeds choice (entailment / neutral / contradiction).

  - id: kev_legacy_policy
    name: Kev generated policy cases (contrastive.py families; 896 records in decision-v7; noul / choice / score)
    kind: dataset
    source: https://github.com/jaredpalmer/kev kev/contrastive.py @ 2074cc44, vendored in models/gowa/third_party/kev/
    licence: Apache-2.0
    commercial: yes
    include: yes
    tasks: [general]
    reason: Template code under Apache-2.0 with invented names and amounts, no third-party text; we regenerate with our own seed (NOTICE kept in third_party/kev).

  - id: kev_compositional
    name: Kev generated rule-structure cases (composition.py; 1,680 records from 60 structures in decision-v7; choice)
    kind: dataset
    source: https://github.com/jaredpalmer/kev kev/composition.py @ 2074cc44, vendored in models/gowa/third_party/kev/
    licence: Apache-2.0
    commercial: yes
    include: yes
    tasks: [general]
    reason: Template code under Apache-2.0, no third-party text; regenerated with our own seed, held-out structures stay excluded as in Kev.

  - id: boolq
    name: BoolQ (Google) — 15,942 yes/no questions on Wikipedia passages (Kev decision-v7, noul)
    kind: dataset
    source: https://github.com/google-research-datasets/boolean-questions (HF google/boolq)
    licence: CC-BY-SA-3.0
    commercial: yes
    include: no
    tasks: []
    reason: REVIEW — share-alike; whether SA reaches trained weights is not settled. Out until the founder decides (would feed noul).

  - id: dbpedia14
    name: DBpedia-14 (Zhang et al. 2015) — 630k Wikipedia abstracts, 14 classes (Kev decision-v7, choice)
    kind: dataset
    source: https://huggingface.co/datasets/fancyzhx/dbpedia_14 (from DBpedia 2014)
    licence: CC-BY-SA-3.0 (and GFDL, inherited from DBpedia / Wikipedia)
    commercial: yes
    include: no
    tasks: []
    reason: REVIEW — share-alike plus GFDL; out until the founder decides whether SA on model weights is acceptable (would feed choice).

  - id: agnews
    name: AG News (Zhang et al. 2015, from the ComeToMyHead corpus) — 127,600 news articles, 4 topics (Kev decision-v7, choice + noul)
    kind: dataset
    source: http://groups.di.unipi.it/~gulli/AG_corpus_of_news_articles.html (HF fancyzhx/ag_news)
    licence: none published; the corpus page says research and other non-commercial activity
    commercial: no
    include: no
    tasks: []
    reason: The source corpus is provided for research and non-commercial activity only; the HF card says licence unknown.

  - id: yelp_review_full
    name: Yelp Review Full (Zhang et al. 2015, from the Yelp Dataset Challenge) — 700k reviews, 1-5 stars (Kev decision-v7, score + noul)
    kind: dataset
    source: https://www.yelp.com/dataset (HF Yelp/yelp_review_full)
    licence: Yelp Dataset Terms of Use (other; personal, educational and academic use only)
    commercial: no
    include: no
    tasks: []
    reason: Yelp's dataset agreement does not allow commercial use.

  - id: imdb
    name: IMDb Large Movie Review Dataset (Maas et al. 2011) — 50k reviews, positive/negative (Kev decision-v7, noul)
    kind: dataset
    source: https://ai.stanford.edu/~amaas/data/sentiment/ (HF stanfordnlp/imdb)
    licence: none published (HF "other"); review text is IMDb user content under IMDb's conditions of use
    commercial: no
    include: no
    tasks: []
    reason: No licence from the authors and IMDb's terms restrict commercial reuse of its content.

  - id: amazon_reviews_multi
    name: Multilingual Amazon Reviews Corpus, English part (Keung et al. 2020) — 210k reviews, 1-5 stars (Kev decision-v7, score)
    kind: dataset
    source: https://registry.opendata.aws/amazon-reviews-ml/ (Kev uses the SetFit/amazon_reviews_multi_en mirror)
    licence: Amazon's own agreement, non-commercial research only (the SetFit mirror's Apache-2.0 tag does not override it)
    commercial: no
    include: no
    tasks: []
    reason: Non-commercial research licence ("you may not ... make any commercial use"); the dataset has since been withdrawn by Amazon.

  - id: sst5
    name: Stanford Sentiment Treebank, 5 classes (Socher et al. 2013, from Rotten Tomatoes via Pang & Lee) — 11,855 sentences (Kev decision-v7, score)
    kind: dataset
    source: https://nlp.stanford.edu/sentiment/ (Kev uses SetFit/sst5)
    licence: none published (HF stanfordnlp/sst says unknown; the mirror has no licence)
    commercial: unclear
    include: no
    tasks: []
    reason: No licence from the authors; the review snippets are Rotten Tomatoes content.

  - id: trec
    name: TREC question classification (Li & Roth 2002) — 5,952 questions, 6 coarse types (Kev decision-v7, choice)
    kind: dataset
    source: https://cogcomp.seas.upenn.edu/Data/QA/QC/ (HF CogComp/trec)
    licence: none published (HF card says unknown)
    commercial: unclear
    include: no
    tasks: []
    reason: No licence from the authors; questions partly come from TREC collections with their own terms.

  - id: tasksource_jev_typed
    name: tasksource Jev typed decisions
    kind: dataset
    source: https://huggingface.co/datasets/tasksource/jev-typed-decisions
    licence: other
    commercial: unclear
    include: no
    tasks: []
    reason: Licence "other"; avoid for shipped weights.

  - id: horizon_injection_data
    name: Horizon prompt-injection-guard training data (as listed in its card)
    kind: dataset
    source: https://huggingface.co/Horizon-Labs/prompt-injection-guard-small
    licence: stated permissive only (per card)
    commercial: unclear
    include: no
    tasks: []
    reason: Pending a spot check of every listed source.

  - id: client_documents
    name: Client documents and anything from a lawyer's matters
    kind: never
    source: OpenLex users' computers
    licence: confidential
    commercial: no
    include: no
    tasks: []
    reason: Never used for training or labelling. Nothing leaves the lawyer's computer.
